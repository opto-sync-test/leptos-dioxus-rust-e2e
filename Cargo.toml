[package]
name = "leptos-dioxus-rust-e2e"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
dioxus = { version = "0.7.3", default-features = false, features = ["html", "macro", "signals", "ssr"] }
leptos = { version = "0.8.12", features = ["ssr"] }
opto-sync-client = { path = "vendor/opto-sync-clients/clients/rust", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
pedantic = "warn"
