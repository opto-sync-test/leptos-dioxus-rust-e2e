name: ores-stack leptos-dioxus two-pass

on:
  push:
    branches:
      - test/ores-stack-two-pass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opto-sync-test-ores-stack-two-pass
  cancel-in-progress: true

jobs:
  two-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Opto Sync test consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Check out api-docs page-build authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/api-docs
          ref: DEN-3960-rust-fs-routing
          path: deps/api-docs
          persist-credentials: false
          show-progress: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Run Leptos and Dioxus two-pass consumer
        run: cargo run --manifest-path certification/ores-stack-two-pass/Cargo.toml
